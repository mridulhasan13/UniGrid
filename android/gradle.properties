org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:CICompilerCount=2 -XX:+UseG1GC
android.useAndroidX=true
android.enableJetifier=false
android.builtInKotlin=true
# Disable Kotlin incremental compilation to fix cross-drive root errors (B: project vs C: pub cache)
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Disable native debug symbol stripping to avoid IOException on Windows paths
android.native.debugSymbolLevel=NONE
org.gradle.workers.max=2

