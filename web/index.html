<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The official academic and interactive communication hub for the UniGrid platform.">
  <meta name="theme-color" content="#030710">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <!-- ═══════════════════════════════════════════════════════════
       iOS PWA — Required for "Add to Home Screen" to work properly
       ═══════════════════════════════════════════════════════════ -->

  <!-- Tells iOS Safari to run as a standalone full-screen app (hides browser chrome) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Black-translucent makes the status bar overlay the app content (uses viewport-fit=cover area) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UniGrid">

  <!-- Apple touch icons — iOS picks the closest size; all common sizes listed -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <!-- iOS Splash Screens — Without these iOS shows a white flash on launch.
       Each media query targets a specific device resolution. -->
  <!-- iPhone SE (1st gen) / iPod touch 5th gen -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)">
  <!-- iPhone 6/7/8 -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
  <!-- iPhone 6+/7+/8+ -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone X / XS -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone XS Max / XR -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone 12/13/14 mini -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone 12/13/14 Pro Max -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone 14 Pro / 15 Pro (Dynamic Island) -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone 14 Pro Max / 15 Pro Max -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPad Mini -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)">
  <!-- iPad Air / Pro 10.5" -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2)">
  <!-- iPad Pro 11" -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)">
  <!-- iPad Pro 12.9" -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png"
    media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UniGrid</title>
  <link rel="manifest" href="manifest.json">


  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>

  <!-- PDF.js library for syncfusion_flutter_pdfviewer web support (deferred to prevent blocking initial load) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js" defer></script>
  <script type="text/javascript">
    window.addEventListener('load', function() {
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
      }
    });
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #091428 0%, #030710 100%);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .logo-box {
      position: relative;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: scale-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .halo {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 1.5px solid rgba(59, 130, 246, 0.15);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    .spinner {
      position: absolute;
      width: 68px;
      height: 68px;
      border: 2.5px solid rgba(255, 255, 255, 0.05);
      border-top: 2.5px solid #3B82F6;
      border-radius: 50%;
      animation: rotate 1s linear infinite;
    }

    .logo-img {
      width: 36px;
      height: 36px;
      z-index: 10;
      animation: logo-pulse 1s ease-in-out infinite alternate;
    }

    .loading-text {
      margin-top: 24px;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      opacity: 0;
      animation: fade-in-up 0.5s ease-out 0.15s forwards;
    }

    .loading-subtext {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.38);
      font-size: 12px;
      opacity: 0;
      animation: fade-in-up 0.5s ease-out 0.3s forwards;
    }

    .retry-btn {
      margin-top: 24px;
      padding: 10px 28px;
      background: #3B82F6;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      letter-spacing: 0.5px;
    }

    .retry-btn:active { opacity: 0.8; }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes logo-pulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }

    @keyframes scale-up {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fade-in-up {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- iOS "Add to Home Screen" install banner — only shown on iPhone/iPad Safari
       since iOS doesn't expose a native PWA install prompt like Android/Chrome does. -->
  <div id="ios-install-banner" style="
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(13, 27, 42, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(59, 130, 246, 0.3);
    padding: 14px 20px 24px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    box-shadow: 0 -4px 30px rgba(0,0,0,0.5);
  ">
    <button onclick="document.getElementById('ios-install-banner').style.display='none'" style="
      position: absolute; top: 10px; right: 14px;
      background: none; border: none; color: rgba(255,255,255,0.5);
      font-size: 20px; cursor: pointer; padding: 0; line-height: 1;
    ">✕</button>
    <div style="display:flex; align-items:center; gap:14px;">
      <img src="icons/Icon-192.png" style="width:46px;height:46px;border-radius:12px;flex-shrink:0;" alt="UniGrid">
      <div>
        <div style="color:#fff; font-size:15px; font-weight:700; margin-bottom:3px;">Install UniGrid</div>
        <div style="color:rgba(255,255,255,0.6); font-size:12px; line-height:1.4;">
          Tap <strong style="color:#3B82F6;">Share</strong> <span style="font-size:15px;">⎙</span>
          then <strong style="color:#3B82F6;">"Add to Home Screen"</strong> for the full app experience.
        </div>
      </div>
    </div>
  </div>

  <div class="loader-container" id="unigrid-splash">
    <div class="logo-box">
      <div class="halo"></div>
      <div class="spinner" id="unigrid-spinner"></div>
      <img src="assets/assets/images/logo.png" class="logo-img" alt="UniGrid" onerror="this.onerror=null; this.src='assets/images/logo.png';">
    </div>
    <div class="loading-text" id="unigrid-loading-text">Loading UniGrid...</div>
    <div class="loading-subtext" id="unigrid-loading-subtext">Initializing workspace environment</div>
    <button class="retry-btn" id="unigrid-retry-btn" onclick="window.location.reload()">Tap to Retry</button>
  </div>

  <script>
    // --- Auto-Recovery System for UniGrid Web ---
    function _removeSplash() {
      var splash = document.getElementById('unigrid-splash');
      if (splash) {
        splash.style.transition = 'opacity 0.5s ease';
        splash.style.opacity = '0';
        setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
      }
    }

    var _retryCount = parseInt(sessionStorage.getItem('unigrid_retry_count') || '0', 10);

    function _clearCachesAndReload() {
      sessionStorage.setItem('unigrid_retry_count', (_retryCount + 1).toString());
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            // Only unregister Flutter's SW — preserve firebase-messaging-sw.js
            var swUrl = registrations[i].active?.scriptURL || registrations[i].installing?.scriptURL || '';
            if (swUrl.includes('flutter_service_worker')) {
              registrations[i].unregister();
            }
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) caches.delete(name);
        });
      }
      setTimeout(function() {
        window.location.reload(true);
      }, 300);
    }

    function _showRetry(msg) {
      var subtext = document.getElementById('unigrid-loading-subtext');
      var spinner = document.getElementById('unigrid-spinner');
      var btn = document.getElementById('unigrid-retry-btn');
      var loadingText = document.getElementById('unigrid-loading-text');

      if (subtext) subtext.textContent = msg || 'Attempting automatic recovery...';
      if (loadingText) loadingText.textContent = 'Refreshing UniGrid...';
      if (spinner) {
        spinner.style.borderTopColor = '#00E676';
        spinner.style.display = 'block';
      }

      if (btn) {
        btn.textContent = 'Clean Cache & Reload';
        btn.onclick = _clearCachesAndReload;
        btn.style.display = 'block';
      }

      // Auto-retry once after 3.5 seconds if stuck
      if (_retryCount < 3) {
        setTimeout(_clearCachesAndReload, 3500);
      }
    }

    // Reset retry counter on successful load
    window._onAppLoaded = function() {
      sessionStorage.removeItem('unigrid_retry_count');
      _removeSplash();
    };

    // Auto-reload when internet connection is restored
    window.addEventListener('online', function() {
      var btn = document.getElementById('unigrid-retry-btn');
      if (btn && btn.style.display === 'block') {
        _clearCachesAndReload();
      }
    });

    // --- Automatic silent background load timeout (10s) & recovery ---
    var _loadTimeout = setTimeout(function() {
      if (_retryCount < 3) {
        _clearCachesAndReload();
      }
    }, 10000);

    // --- Global JS error handler (silent background recovery) ---
    window.addEventListener('error', function(e) {
      console.error('UniGrid load error:', e.message);
      clearTimeout(_loadTimeout);
      if (_retryCount < 3) {
        _clearCachesAndReload();
      }
    });

    window.addEventListener('load', function(ev) {
      // Unregister only Flutter's own service worker (flutter_service_worker.js)
      // to ensure fresh loading. We deliberately PRESERVE firebase-messaging-sw.js
      // so that FCM web push notifications continue to work in the background.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var swUrl = registrations[i].active?.scriptURL || registrations[i].installing?.scriptURL || '';
            if (swUrl.includes('flutter_service_worker')) {
              registrations[i].unregister();
            }
          }
        });
        navigator.serviceWorker.register('/firebase-messaging-sw.js?v=20260730_v4')
          .then(function(reg) {
            console.log('[UniGrid] FCM Service Worker registered with scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[UniGrid] FCM Service Worker registration notice:', err);
          });
      }

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          clearTimeout(_loadTimeout);
          engineInitializer.initializeEngine().then(function(appRunner) {
            window._onAppLoaded();
            appRunner.runApp();
          }).catch(function(err) {
            console.error('Flutter engine init failed:', err);
            _showRetry('Engine initialization error. Tap below to reload.');
          });
        }
      });
    });
  </script>

  <script>
    // Show iOS "Add to Home Screen" banner ONLY on genuine iOS Safari.
    // Detection uses two Apple-exclusive signals that no desktop browser can fake:
    //   1. window.navigator.standalone exists ONLY on iOS (it's undefined on every
    //      desktop OS including macOS Safari, Windows, Android, etc.)
    //   2. Explicit UA exclusions for iOS Chrome (CriOS), Firefox (FxiOS),
    //      Edge (EdgiOS), and Opera (OPiOS) — which ARE on iOS but can't install PWAs.
    (function() {
      var ua = navigator.userAgent;

      // navigator.standalone is an Apple-only property — undefined on ALL non-iOS browsers
      var isReallyIos = typeof window.navigator.standalone !== 'undefined' &&
                        /iPhone|iPad|iPod/.test(ua);

      // Exclude other browsers that run on iOS (they can't install PWAs)
      var isIosChrome  = /CriOS/.test(ua);
      var isIosFirefox = /FxiOS/.test(ua);
      var isIosEdge    = /EdgiOS/.test(ua);
      var isIosOpera   = /OPiOS/.test(ua);
      var isNativeSafari = isReallyIos && !isIosChrome && !isIosFirefox && !isIosEdge && !isIosOpera;

      // navigator.standalone === true means already running as installed PWA — no need to prompt
      var isAlreadyInstalled = window.navigator.standalone === true;

      var bannerDismissed = sessionStorage.getItem('unigrid_ios_banner_dismissed');

      if (isNativeSafari && !isAlreadyInstalled && !bannerDismissed) {
        // Delay slightly so it appears after the Flutter app has painted
        setTimeout(function() {
          var banner = document.getElementById('ios-install-banner');
          if (banner) {
            banner.style.display = 'block';
            // Auto-fade after 12 seconds if the user ignores it
            setTimeout(function() {
              if (banner.style.display !== 'none') {
                banner.style.transition = 'opacity 0.4s ease';
                banner.style.opacity = '0';
                setTimeout(function() { banner.style.display = 'none'; }, 400);
              }
            }, 12000);
          }
        }, 2000);

        // Remember dismissal for this browser session so it doesn't re-appear on reload
        document.getElementById('ios-install-banner')
          .querySelector('button')
          .addEventListener('click', function() {
            sessionStorage.setItem('unigrid_ios_banner_dismissed', '1');
          });
      }
    })();
  </script>
</body>
</html>
