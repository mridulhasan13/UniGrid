<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The official academic and interactive communication hub for the UniGrid platform.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UniGrid">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UniGrid</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

  <!-- PDF.js library for syncfusion_flutter_pdfviewer web support (deferred to prevent blocking initial load) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js" defer></script>
  <script type="text/javascript">
    window.addEventListener('load', function() {
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
      }
    });
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #091428 0%, #030710 100%);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .logo-box {
      position: relative;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: scale-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .halo {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 1.5px solid rgba(59, 130, 246, 0.15);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    .spinner {
      position: absolute;
      width: 68px;
      height: 68px;
      border: 2.5px solid rgba(255, 255, 255, 0.05);
      border-top: 2.5px solid #3B82F6;
      border-radius: 50%;
      animation: rotate 1s linear infinite;
    }

    .logo-img {
      width: 36px;
      height: 36px;
      z-index: 10;
      animation: logo-pulse 1s ease-in-out infinite alternate;
    }

    .loading-text {
      margin-top: 24px;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      opacity: 0;
      animation: fade-in-up 0.5s ease-out 0.15s forwards;
    }

    .loading-subtext {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.38);
      font-size: 12px;
      opacity: 0;
      animation: fade-in-up 0.5s ease-out 0.3s forwards;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes logo-pulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }

    @keyframes scale-up {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fade-in-up {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader-container" id="unigrid-splash">
    <div class="logo-box">
      <div class="halo"></div>
      <div class="spinner"></div>
      <img src="assets/assets/images/logo.png" class="logo-img" alt="UniGrid" onerror="this.onerror=null; this.src='assets/images/logo.png';">
    </div>
    <div class="loading-text">Loading UniGrid...</div>
    <div class="loading-subtext">Initializing workspace environment</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            Promise.resolve(appRunner.runApp()).then(function() {
              // Smoothly fade out the splash screen once Flutter renders
              const splash = document.getElementById('unigrid-splash');
              if (splash) {
                splash.style.transition = 'opacity 0.5s ease';
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 500);
              }
            });
          });
        }
      });
    });
  </script>
</body>
</html>
