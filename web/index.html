<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The official academic and interactive communication hub for the UniGrid platform.">
  <meta name="theme-color" content="#030710">

  <!-- Instant Resource Preloaders -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="canvaskit/canvaskit.js" as="script">

  <!-- High-Speed Web Resource Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UniGrid">

  <!-- Apple touch icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <title>UniGrid</title>
  <link rel="manifest" href="manifest.json">

  <script src="flutter_bootstrap.js" async></script>

  <!-- PDF.js library for syncfusion_flutter_pdfviewer web support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js" defer></script>
  <script type="text/javascript">
    window.addEventListener('load', function() {
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
      }
    });
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #091428 0%, #030710 100%);
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .logo-box {
      position: relative;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: scale-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .halo {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 1.5px solid rgba(59, 130, 246, 0.15);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    .spinner {
      position: absolute;
      width: 68px;
      height: 68px;
      border: 2.5px solid rgba(255, 255, 255, 0.05);
      border-top: 2.5px solid #3B82F6;
      border-radius: 50%;
      animation: rotate 1s linear infinite;
    }

    .logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 10px;
      z-index: 10;
      filter: drop-shadow(0 2px 10px rgba(59, 130, 246, 0.35));
      animation: logo-pulse 1.2s ease-in-out infinite alternate;
    }

    .loading-text {
      margin-top: 24px;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      opacity: 0;
      animation: fade-in-up 0.5s ease-out 0.15s forwards;
    }

    .loading-subtext {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.38);
      font-size: 12px;
      opacity: 0;
      animation: fade-in-up 0.5s ease-out 0.3s forwards;
    }

    .retry-btn {
      margin-top: 24px;
      padding: 10px 28px;
      background: #3B82F6;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      letter-spacing: 0.5px;
    }

    .retry-btn:active { opacity: 0.8; }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes logo-pulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }

    @keyframes scale-up {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fade-in-up {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- iOS "Add to Home Screen" install banner -->
  <div id="ios-install-banner" style="
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(13, 27, 42, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(59, 130, 246, 0.3);
    padding: 14px 20px 24px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    box-shadow: 0 -4px 30px rgba(0,0,0,0.5);
  ">
    <button onclick="document.getElementById('ios-install-banner').style.display='none'" style="
      position: absolute; top: 10px; right: 14px;
      background: none; border: none; color: rgba(255,255,255,0.5);
      font-size: 20px; cursor: pointer; padding: 0; line-height: 1;
    ">✕</button>
    <div style="display:flex; align-items:center; gap:14px;">
      <img src="icons/Icon-192.png" style="width:46px;height:46px;border-radius:12px;flex-shrink:0;" alt="UniGrid">
      <div>
        <div style="color:#fff; font-size:15px; font-weight:700; margin-bottom:3px;">Install UniGrid</div>
        <div style="color:rgba(255,255,255,0.6); font-size:12px; line-height:1.4;">
          Tap <strong style="color:#3B82F6;">Share</strong> <span style="font-size:15px;">⎙</span>
          then <strong style="color:#3B82F6;">"Add to Home Screen"</strong> for the full app experience.
        </div>
      </div>
    </div>
  </div>

  <div class="loader-container" id="unigrid-splash">
    <div class="logo-box">
      <div class="halo"></div>
      <div class="spinner" id="unigrid-spinner"></div>
      <img src="logo.png" class="logo-img" alt="UniGrid" onerror="this.onerror=null; this.src='icons/Icon-192.png';">
    </div>
    <div class="loading-text" id="unigrid-loading-text">Loading UniGrid...</div>
    <div class="loading-subtext" id="unigrid-loading-subtext">Initializing workspace environment</div>
    <button class="retry-btn" id="unigrid-retry-btn" onclick="window.location.reload()">Tap to Retry</button>
  </div>

  <script>
    // --- Auto-Recovery & Cache Management System for UniGrid Web ---
    var _isAppLoaded = false;

    function _removeSplash() {
      var splash = document.getElementById('unigrid-splash');
      if (splash) {
        splash.style.transition = 'opacity 0.5s ease';
        splash.style.opacity = '0';
        setTimeout(function() { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
      }
    }

    var _retryCount = parseInt(sessionStorage.getItem('unigrid_retry_count') || '0', 10);

    function _clearCachesAndReload() {
      if (sessionStorage.getItem('unigrid_reloading') === '1') return;
      sessionStorage.setItem('unigrid_reloading', '1');
      sessionStorage.setItem('unigrid_retry_count', (_retryCount + 1).toString());

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var swUrl = registrations[i].active?.scriptURL || registrations[i].installing?.scriptURL || registrations[i].waiting?.scriptURL || '';
            if (swUrl.includes('flutter_service_worker')) {
              registrations[i].unregister();
            }
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) caches.delete(name);
        });
      }
      setTimeout(function() {
        sessionStorage.removeItem('unigrid_reloading');
        window.location.reload(true);
      }, 300);
    }

    function _showRetry(msg) {
      var subtext = document.getElementById('unigrid-loading-subtext');
      var spinner = document.getElementById('unigrid-spinner');
      var btn = document.getElementById('unigrid-retry-btn');
      var loadingText = document.getElementById('unigrid-loading-text');

      if (subtext) subtext.textContent = msg || 'Attempting automatic recovery...';
      if (loadingText) loadingText.textContent = 'Refreshing UniGrid...';
      if (spinner) {
        spinner.style.borderTopColor = '#00E676';
        spinner.style.display = 'block';
      }

      if (btn) {
        btn.textContent = 'Clean Cache & Reload';
        btn.onclick = _clearCachesAndReload;
        btn.style.display = 'block';
      }

      if (_retryCount < 3) {
        setTimeout(_clearCachesAndReload, 3500);
      }
    }

    // Reset retry counter on successful load
    window._onAppLoaded = function() {
      _isAppLoaded = true;
      sessionStorage.removeItem('unigrid_retry_count');
      sessionStorage.removeItem('unigrid_reloading');
      localStorage.removeItem('unigrid_purging');
      _removeSplash();
    };

    // Auto-reload when internet connection is restored if stuck on error
    window.addEventListener('online', function() {
      var btn = document.getElementById('unigrid-retry-btn');
      if (btn && btn.style.display === 'block' && !_isAppLoaded) {
        _clearCachesAndReload();
      }
    });

    // Silent load timeout (15s fallback if engine hangs)
    var _loadTimeout = setTimeout(function() {
      if (!_isAppLoaded && _retryCount < 3) {
        _clearCachesAndReload();
      }
    }, 15000);

    // Global JS error handler
    window.addEventListener('error', function(e) {
      if (_isAppLoaded) return;
      console.warn('[UniGrid Web] Engine load notice:', e.message);
    });

    // ════════════════════════════════════════════════════════════════════════
    // Live Build Cache Purger & Auto-Updater System
    // ════════════════════════════════════════════════════════════════════════
    var CURRENT_APP_VERSION = '20260806_v12';

    function _purgeBrowserCacheAndReload(newVersion) {
      console.log('[UniGrid Auto-Purger] Upgrading build version to:', newVersion);
      if (localStorage.getItem('unigrid_purging') === '1') return;
      localStorage.setItem('unigrid_purging', '1');

      localStorage.setItem('unigrid_app_version', newVersion);
      localStorage.setItem('unigrid_last_cache_clear', Date.now().toString());

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var swUrl = registrations[i].active?.scriptURL || registrations[i].installing?.scriptURL || registrations[i].waiting?.scriptURL || '';
            if (swUrl.includes('flutter_service_worker')) {
              registrations[i].unregister();
            }
          }
        });
      }

      if ('caches' in window) {
        caches.keys().then(function(names) {
          return Promise.all(names.map(function(name) { return caches.delete(name); }));
        }).then(function() {
          _finishPurgeAndReload();
        }).catch(function() {
          _finishPurgeAndReload();
        });
      } else {
        _finishPurgeAndReload();
      }
    }

    function _finishPurgeAndReload() {
      setTimeout(function() {
        localStorage.removeItem('unigrid_purging');
        window.location.reload(true);
      }, 200);
    }

    // Check version and 5-day cache timer on page load
    (function _checkImmediateVersionAndTimer() {
      var savedVersion = localStorage.getItem('unigrid_app_version');
      var lastClearTime = parseInt(localStorage.getItem('unigrid_last_cache_clear') || '0', 10);
      var FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;
      var isExpiredFiveDays = lastClearTime > 0 && (Date.now() - lastClearTime) > FIVE_DAYS_MS;

      if (!savedVersion) {
        localStorage.setItem('unigrid_app_version', CURRENT_APP_VERSION);
        localStorage.setItem('unigrid_last_cache_clear', Date.now().toString());
        localStorage.removeItem('unigrid_purging');
      } else if (savedVersion !== CURRENT_APP_VERSION || isExpiredFiveDays) {
        if (isExpiredFiveDays) {
          console.log('[UniGrid Auto-Purger] 5 days elapsed since last cache clear. Purging cache...');
        }
        _purgeBrowserCacheAndReload(CURRENT_APP_VERSION);
      } else {
        localStorage.removeItem('unigrid_purging');
      }
    })();

    // Live Deployment Checker
    function _checkLiveDeploymentUpdate() {
      fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function(res) {
          if (!res.ok) return null;
          var contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('application/json') && !contentType.includes('text/plain')) return null;
          return res.json();
        })
        .then(function(data) {
          if (!data) return;
          var liveBuildNumber = data.build_number || data.version;
          if (!liveBuildNumber) return;
          var storedLiveBuild = localStorage.getItem('unigrid_live_build');
          if (storedLiveBuild && storedLiveBuild !== String(liveBuildNumber)) {
            console.log('[UniGrid Live Deploy] New version detected live! Purging cache...');
            localStorage.setItem('unigrid_live_build', String(liveBuildNumber));
            _purgeBrowserCacheAndReload(CURRENT_APP_VERSION + '_' + liveBuildNumber);
          } else {
            localStorage.setItem('unigrid_live_build', String(liveBuildNumber));
          }
        })
        .catch(function(err) {
          console.log('[UniGrid Live Deploy] Version check skipped:', err);
        });
    }

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        _checkLiveDeploymentUpdate();
      }
    });

    window.addEventListener('flutter-first-frame', function() {
      clearTimeout(_loadTimeout);
      window._onAppLoaded();
    });

    window.addEventListener('load', function(ev) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var swUrl = registrations[i].active?.scriptURL || registrations[i].installing?.scriptURL || registrations[i].waiting?.scriptURL || '';
            if (swUrl.includes('flutter_service_worker')) {
              registrations[i].unregister();
            }
          }
        });
      }
    });
  </script>
</body>
</html>
