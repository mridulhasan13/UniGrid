# Netlify Configuration File
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "bash netlify_build.sh"
  publish = "build/web"
  functions = "netlify/functions"

# Direct URL rewrites for Single Page App (SPA) routing.
# This prevents 404 errors when reloading pages or navigating directly to routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html must NEVER be cached — this ensures browsers always load the latest app version
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Service Worker must NEVER be cached — browsers must always fetch the latest version
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache optimizations for Flutter Web static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
